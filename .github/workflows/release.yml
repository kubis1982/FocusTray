name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Extract version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
          
      - name: Restore dependencies
        run: dotnet restore FocusTray.slnx
        
      - name: Run tests
        run: dotnet test FocusTray.slnx --configuration Release --no-restore
        
      - name: Publish application
        run: dotnet publish src/FocusTray/FocusTray.csproj -c Release -r win-x64 --self-contained -o publish
        
      - name: Rename executable
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Move-Item -Path "publish\FocusTray.exe" -Destination "publish\FocusTray-v$version-win-x64.exe"
          
      - name: Calculate SHA256
        id: sha256
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $hash = (Get-FileHash -Path "publish\FocusTray-v$version-win-x64.exe" -Algorithm SHA256).Hash
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA256: $hash"
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: FocusTray v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## FocusTray v${{ steps.get_version.outputs.VERSION }}
            
            ### Installation
            
            **WinGet (Recommended):**
            ```
            winget install Kubis1982.FocusTray
            ```
            
            **Manual Installation:**
            Download `FocusTray-v${{ steps.get_version.outputs.VERSION }}-win-x64.exe` and run it.
            
            ### SHA256 Checksum
            ```
            ${{ steps.sha256.outputs.HASH }}
            ```
            
            ### Requirements
            - Windows 10 (build 19041) or later
            - No additional dependencies (self-contained)
            
            ### What's Changed
            See [CHANGELOG.md](https://github.com/kubis1982/FocusTray/blob/main/CHANGELOG.md) for details.
          files: |
            publish/FocusTray-v${{ steps.get_version.outputs.VERSION }}-win-x64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
