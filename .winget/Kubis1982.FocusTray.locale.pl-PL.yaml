ShortDescription: Minimalistyczna aplikacja zasobnika systemowego Windows do utrzymania głębokiego skupienia podczas sesji pracy
Description: |-
  FocusTray to lekkie narzędzie produktywności, które mieszka w zasobniku systemowym Windows, pomagając pozostać skupionym na pracy dzięki konfigurowalnym sesjom fokusa.
  
  Kluczowe funkcje:
  - Inteligentna integracja z zasobnikiem systemowym z dynamicznymi ikonami
  - Konfigurowalne sesje fokusa (1 minuta do 24 godzin)
  - Integracja z JIRA z automatycznym logowaniem czasu pracy
  - Nienachalne powiadomienia Windows toast
  - Wizualne śledzenie sesji z odliczaniem w czasie rzeczywistym
  - Zarządzanie sesją (start, pauza, wznowienie, stop)
  
  Idealne dla:
  - Praktyków techniki Pomodoro
  - Pracowników zdalnych śledzących czas w JIRA
  - Każdego szukającego okresów pracy bez rozpraszaczy
