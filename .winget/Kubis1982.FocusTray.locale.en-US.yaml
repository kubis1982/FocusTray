ShortDescription: A minimalist Windows system tray application for maintaining deep focus during work sessions
Description: |-
  FocusTray is a lightweight productivity tool that lives in your Windows system tray, helping you stay focused on your work with configurable focus sessions.
  
  Key features:
  - Smart system tray integration with dynamic icons
  - Customizable focus sessions (1 minute to 24 hours)
  - JIRA integration with automatic worklog tracking
  - Non-intrusive Windows toast notifications
  - Visual session tracking with real-time countdown
  - Session management (start, pause, resume, stop)
  
  Perfect for:
  - Pomodoro technique practitioners
  - Remote workers tracking time in JIRA
  - Anyone seeking distraction-free work periods
